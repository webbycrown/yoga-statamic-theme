title: Page
tabs:
  main:
    display: Page
    sections:
      -
        display: Content
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
      -
        display: Theme sections
        instructions: Every marketing page uses the same Page template. Add any section here and drag to reorder. Book class and 404 keep dedicated templates.
        fields:
          -
            import: all_page_builder
      -
        display: Page chrome
        fields:
          -
            handle: template
            field:
              type: template
              display: Template
              default: page
              instructions: Marketing pages use page. Keep book-class for booking and 404 for the error page.
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
  seo:
    display: SEO
    sections:
      -
        display: Search and social
        fields:
          -
            import: seo
